{% extends 'base.html' %}

{% block title %}{{ notice.title }} - 系统公告 - 海报工坊{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <a href="{% url 'notices' %}" class="btn btn-outline-secondary btn-sm mb-3">
                <i class="bi bi-arrow-left"></i> 返回公告列表
            </a>
            <div class="card">
                <div class="card-body p-4">
                    <h4 class="fw-bold mb-2">{{ notice.title }}</h4>
                    <p class="text-muted small mb-4">发布时间：{{ notice.created_at|date:"Y-m-d H:i" }}</p>
                    <div style="white-space: pre-wrap;">{{ notice.content }}</div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
